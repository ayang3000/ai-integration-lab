spring.application.name=ai-integration-lab
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
ai.provider=${AI_PROVIDER:mock}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ai.ollama.model=${OLLAMA_MODEL:}
ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:30}
